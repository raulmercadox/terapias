# /etc/nginx/conf.d/terapias.conf
#
# El VPS es compartido con sistema_comercial (codart.pe) y clinica-dental
# (dental.codart.pe): este bloque NO declara default_server ni server_name "_",
# para no quedarse con el tráfico de las otras apps. Solo responde a su dominio.
#
# El HTTPS lo agrega Certbot:  certbot --nginx -d terapias.codart.pe
server {
    server_name terapias.codart.pe;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/terapias.codart.pe/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/terapias.codart.pe/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = terapias.codart.pe) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name terapias.codart.pe;
    return 404; # managed by Certbot


}
