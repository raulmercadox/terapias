server {
    server_name geniusschool.com.pe www.geniusschool.com.pe 2.25.162.59 _;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/geniusschool.com.pe/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/geniusschool.com.pe/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.geniusschool.com.pe) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = geniusschool.com.pe) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name geniusschool.com.pe www.geniusschool.com.pe 2.25.162.59 _;
    return 404; # managed by Certbot




}
